<!DOCTYPE html>
<html lang="ceb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Ads & Earn GCash</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 440px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; }
        button:hover { background: #1d4ed8; }
        .balance { font-size: 26px; color: #4ade80; font-weight: bold; margin: 15px 0; }
        .ad-box { background: #334155; height: 100px; display: flex; justify-content: center; align-items: center; border-radius: 6px; margin: 12px 0; color: #94a3b8; font-size: 14px; border: 2px dashed #64748b; padding: 10px; text-align: center; }
        .notice { font-size: 12px; color: #facc15; background: rgba(250, 204, 21, 0.1); padding: 8px; border-radius: 4px; margin: 10px 0; text-align: left; }
        .referral-box { background: #0f172a; padding: 10px; border-radius: 6px; margin: 12px 0; border: 1px solid #334155; font-size: 12px; text-align: left; }
        .link-btn { background: none; color: #38bdf8; border: none; cursor: pointer; text-decoration: underline; font-size: 13px; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Watch Ads & Earn GCash</h2>

        <!-- LOGIN SECTION -->
        <div id="login-section">
            <p style="color: #94a3b8; font-size: 13px;">Pag-login sa imong account.</p>
            <input type="email" id="login-gmail" placeholder="Gmail Address">
            <input type="password" id="login-password" placeholder="Password">
            <button onclick="loginUser()" style="background: #16a34a;">Login</button>
            <button class="link-btn" onclick="showRegister()">Wala pa kay account? Mag-register diri</button>
        </div>

        <!-- REGISTER SECTION -->
        <div id="register-section" class="hidden">
            <p style="color: #94a3b8; font-size: 13px;">Paghimo og bag-ong account.</p>
            <input type="email" id="reg-gmail" placeholder="Gmail Address">
            <input type="password" id="reg-password" placeholder="Himoa nga Password">
            <input type="text" id="reg-gcash" placeholder="GCash Number (09XXXXXXXXX)">
            <input type="text" id="reg-ref" placeholder="Referral Code (Gmail sa nag-invite - Opsyonal)">
            <button onclick="registerUser()" style="background: #2563eb;">Rehistro Karon</button>
            <button class="link-btn" onclick="showLogin()">Aduna nay account? Pag-login diri</button>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboard-section" class="hidden">
            <p style="color: #94a3b8; font-size: 12px; margin-bottom: 2px;">Account: <span id="current-gmail" style="color: white; font-weight: bold;"></span></p>
            <p style="color: #94a3b8; font-size: 12px;">GCash: <span id="current-gcash" style="color: #38bdf8; font-weight: bold;"></span></p>
            
            <div class="balance">Balanse: ₱<span id="wallet">0.00</span></div>

            <div class="notice">
                ⚠️ Minimum withdrawal: <b>₱100.00</b>.<br>
                🎁 Imbitaha imong mga higala ug dawat og <b>₱1.00</b> matag rehistro nila!
            </div>

            <!-- Referral Link Share Box -->
            <div class="referral-box">
                <span style="color: #94a3b8;">Imong Referral Link:</span>
                <input type="text" id="ref-link-display" readonly style="margin: 5px 0; font-size: 11px; background: #1e293b; color: #38bdf8;">
                <button onclick="copyRefLink()" style="padding: 6px; font-size: 12px; background: #0284c7; margin-top: 2px;">Kopyaha ang Link</button>
            </div>

            <div class="ad-box" id="ad-screen">
                [ I-click ang button sa ubos aron motan-aw sa ad ]
            </div>

            <button onclick="watchAd()">Tan-aw og Ad (+₱5.00)</button>

            <hr style="border: 0; border-top: 1px solid #334155; margin: 12px 0;">

            <button onclick="withdrawGCash()" style="background: #16a34a;">I-withdraw sa GCash (Min. ₱100)</button>
            <button onclick="logout()" style="background: #64748b; font-size: 12px; padding: 6px; margin-top: 8px;">Mag-logout</button>
        </div>
    </div>

    <script>
        let loggedInGmail = "";
        let currentBalance = 0.00;

        // Awtomatikong basahon ang referral code kung naay mo-click sa link nga naay ?ref=...
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const refParam = urlParams.get('ref');
            if (refParam) {
                document.getElementById("reg-ref").value = refParam;
                showRegister();
            }
        };

        function showRegister() {
            document.getElementById("login-section").classList.add("hidden");
            document.getElementById("register-section").classList.remove("hidden");
        }

        function showLogin() {
            document.getElementById("register-section").classList.add("hidden");
            document.getElementById("login-section").classList.remove("hidden");
        }

        function registerUser() {
            const gmail = document.getElementById("reg-gmail").value.trim();
            const password = document.getElementById("reg-password").value.trim();
            const gcash = document.getElementById("reg-gcash").value.trim();
            const refCode = document.getElementById("reg-ref").value.trim();

            if (!gmail || !password || !gcash) {
                alert("Palihug pun-a ang tanang kinahanglang field!");
                return;
            }

            fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ gmail, password, gcash, refCode })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if (data.status === "success") {
                    showLogin();
                }
            });
        }

        function loginUser() {
            const gmail = document.getElementById("login-gmail").value.trim();
            const password = document.getElementById("login-password").value.trim();

            if (!gmail || !password) {
                alert("Palihug isulat ang imong Gmail ug password.");
                return;
            }

            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ gmail, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    loggedInGmail = gmail;
                    currentBalance = data.balance;

                    document.getElementById("current-gmail").innerText = loggedInGmail;
                    document.getElementById("current-gcash").innerText = data.gcash;
                    document.getElementById("wallet").innerText = currentBalance.toFixed(2);

                    // Himoon ang referral link base sa kasamtangang website URL
                    const currentBaseUrl = window.location.origin + window.location.pathname;
                    document.getElementById("ref-link-display").value = currentBaseUrl + "?ref=" + loggedInGmail;

                    document.getElementById("login-section").classList.add("hidden");
                    document.getElementById("dashboard-section").classList.remove("hidden");
                } else {
                    alert(data.message);
                }
            });
        }

        function copyRefLink() {
            const linkInput = document.getElementById("ref-link-display");
            linkInput.select();
            linkInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(linkInput.value);
            alert("Na-copy na ang imong referral link! Pwede na nimo i-share sa imong mga higala.");
        }

        function watchAd() {
            const adScreen = document.getElementById("ad-screen");
            adScreen.innerHTML = "Nag-load ang Ad... Palihug paghulat...";
            
            setTimeout(() => {
                fetch('/claim-reward', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ gmail: loggedInGmail })
                })
                .then(res => res.json())
                .then(data => {
                    currentBalance = data.balance;
                    document.getElementById("wallet").innerText = currentBalance.toFixed(2);
                    adScreen.innerHTML = "Nahuman na nimo ang Ad! Nadugangan og ₱5.00 ang imong balanse.";
                });
            }, 2000);
        }

        function withdrawGCash() {
            if (currentBalance < 100.0) {
                alert("Wala pa ka nakaabot sa minimum. Kinahanglan ₱100.00 pataas ang imong balanse aron maka-withdraw.");
                return;
            }

            fetch('/withdraw', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ gmail: loggedInGmail })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if (data.status === "success") {
                    currentBalance = 0.00;
                    document.getElementById("wallet").innerText = currentBalance.toFixed(2);
                    document.getElementById("ad-screen").innerHTML = "[ I-click ang button sa ubos aron motan-aw sa ad ]";
                }
            });
        }

        function logout() {
            loggedInGmail = "";
            currentBalance = 0.00;
            document.getElementById("login-gmail").value = "";
            document.getElementById("login-password").value = "";
            document.getElementById("dashboard-section").classList.add("hidden");
            document.getElementById("login-section").classList.remove("hidden");
        }
    </script>

</body>
</html>
